[project]
name = "crewai_invoice_contract"
version = "0.1.0"
description = "CrewAI crew that extracts contract and invoice PDF data and produces a discrepancy report"
authors = [{ name = "Prajna Nayak", email = "ppnayak2026@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.22,<2.0.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
kickoff = "crewai_invoice_contract.main:kickoff"
run_crew = "crewai_invoice_contract.main:kickoff"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
